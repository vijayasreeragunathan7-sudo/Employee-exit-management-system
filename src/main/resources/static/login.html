```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Employee Exit Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .login-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 18px;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            margin: 5px 0;
            color: #333;
            font-size: 25px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .admin-label {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 10px;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        #message {
            margin-top: 15px;
            color: red;
            font-size: 14px;
        }

        .demo-login {
            margin-top: 20px;
            padding: 10px;

            background: #f5f5f5;
            border-radius: 10px;

            font-size: 12px;
            color: #666;
        }

        footer {
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 450px) {
            .login-box {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- Login Image -->
        <img
            src="login-image.jpg"
            class="login-image"
            alt="Employee Management"
        >

        <!-- Logo -->
        <div class="logo">
            E
        </div>

        <h1>Employee Exit</h1>
        <h1>Management System</h1>

        <p class="subtitle">
            Admin Login
        </p>

        <div class="admin-label">
            🔐 Administrator Access
        </div>

        <!-- Username -->
        <div class="input-box">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
            >
        </div>

        <!-- Password -->
        <div class="input-box">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
            >
        </div>

        <!-- Login Button -->
        <button class="login-btn" onclick="login()">
            Login
        </button>

        <p id="message"></p>

        <div class="demo-login">
            <b>Demo Login</b><br>
            Username: admin<br>
            Password: admin123
        </div>

        <footer>
            © 2026 Employee Exit Management System
        </footer>

    </div>

    <script>

        function login() {

            let username =
                document.getElementById("username").value.trim();

            let password =
                document.getElementById("password").value;

            if (username === "admin" && password === "admin123") {

                window.location.href = "dashboard.html";

            } else {

                document.getElementById("message").innerText =
                    "Invalid username or password";

            }
        }

        // Press Enter to Login
        document.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                login();
            }

        });

    </script>

</body>
</html>
```
