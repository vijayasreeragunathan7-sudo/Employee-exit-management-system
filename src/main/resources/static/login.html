<!DOCTYPE html>

<html>
<head>
    <title>Login - Employee Exit Management System</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        /* Background design */
        background:
            radial-gradient(circle at top left, #38bdf8 0%, transparent 35%),
            radial-gradient(circle at bottom right, #6366f1 0%, transparent 35%),
            linear-gradient(135deg, #0f172a, #1e3a8a);
    }

    .login-box {
        width: 380px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 20px;
        text-align: center;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.35);
    }

    /* Logo */
    .logo {
        width: 75px;
        height: 75px;
        margin: 0 auto 15px;

        background: linear-gradient(135deg, #2563eb, #7c3aed);
        border-radius: 50%;

        display: flex;
        justify-content: center;
        align-items: center;

        color: white;
        font-size: 35px;
        font-weight: bold;

        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    h1 {
        margin: 5px 0;
        color: #172554;
        font-size: 24px;
    }

    .subtitle {
        margin: 8px 0 25px;
        color: #64748b;
        font-size: 14px;
    }

    .input-group {
        text-align: left;
        margin-bottom: 15px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        color: #334155;
        font-size: 14px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;

        border: 1px solid #cbd5e1;
        border-radius: 8px;

        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;

        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;

        border: none;
        border-radius: 8px;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }

    #message {
        color: #dc2626;
        margin-top: 15px;
        font-size: 14px;
    }

    .footer {
        margin-top: 25px;
        color: #94a3b8;
        font-size: 12px;
    }
</style>
```

</head>

<body>

<div class="login-box">

```
<div class="logo">E</div>

<h1>Employee Exit</h1>

<div class="subtitle">
    Management System
</div>

<div class="input-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username">
</div>

<div class="input-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
</div>

<button onclick="login()">Login</button>

<p id="message"></p>

<div class="footer">
    Employee Exit Management System
</div>
```

</div>

<script>
    function login() {

        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if (username === "admin" && password === "admin123") {
            window.location.href = "dashboard.html";
        } else {
            document.getElementById("message").innerText =
                "Invalid username or password";
        }
    }
</script>

</body>
</html>
