<!DOCTYPE html>
<html>

<head>

    <title>Dashboard - Employee Exit Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #f1f5f9;
            color: #1e293b;
        }

        /* HEADER */

        .header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .logout {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout:hover {
            background: #e0e7ff;
        }


        /* MAIN CONTAINER */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }


        /* WELCOME */

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 5px;
            color: #172554;
        }

        .welcome p {
            color: #64748b;
        }


        /* EMPLOYEE COUNT */

        .employee-count {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;

            padding: 22px 25px;

            border-radius: 12px;

            margin-bottom: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);
        }

        .employee-count h3 {
            color: white;
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        #employeeCount {
            font-size: 32px;
            font-weight: bold;
        }


        /* BOXES */

        .search-box,
        .form-box,
        .employee-box {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        h3 {
            color: #334155;
            margin-top: 0;
        }


        /* SEARCH */

        .search-box input {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .search-box input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.10);
        }


        /* FORM */

        .form-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .form-grid input {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 14px;

            outline: none;
        }

        .form-grid input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.08);
        }


        /* ADD BUTTON */

        .add-btn {

            margin-top: 20px;

            padding: 12px 25px;

            background:
                linear-gradient(135deg,#2563eb,#7c3aed);

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            font-size: 15px;
        }

        .add-btn:hover {

            box-shadow:
                0 5px 12px rgba(37,99,235,0.25);
        }


        /* TABLE */

        .table-container {

            overflow-x: auto;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;
        }

        th {

            background: #eff6ff;

            color: #1e40af;

            padding: 12px;

            text-align: left;
        }

        td {

            padding: 12px;

            border-bottom:
                1px solid #e2e8f0;
        }

        tr:hover {

            background: #f8fafc;
        }


        /* EDIT BUTTON */

        .edit-btn {

            background: #2563eb;

            color: white;

            border: none;

            padding: 7px 12px;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;

            margin-right: 5px;
        }

        .edit-btn:hover {

            background: #1d4ed8;
        }


        /* DELETE BUTTON */

        .delete-btn {

            background: #dc2626;

            color: white;

            border: none;

            padding: 7px 12px;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        .delete-btn:hover {

            background: #b91c1c;
        }


        /* NO DATA */

        .no-data {

            text-align: center;

            color: #64748b;

            padding: 20px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .header {

                padding: 18px;
            }

            .header h1 {

                font-size: 18px;
            }

            .container {

                margin: 20px auto;
            }

            .form-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>
        Employee Exit Management System
    </h1>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</div>



<!-- MAIN -->

<div class="container">


    <!-- WELCOME -->

    <div class="welcome">

        <h2>
            Admin Dashboard
        </h2>

        <p>
            Manage employee exit records
        </p>

    </div>



    <!-- EMPLOYEE COUNT -->

    <div class="employee-count">

        <h3>
            Total Employees
        </h3>

        <div id="employeeCount">
            0
        </div>

    </div>



    <!-- SEARCH -->

    <div class="search-box">

        <h3>
            Search Employee
        </h3>

        <input
            type="text"
            id="search"
            placeholder="Search by name, email or department..."
            onkeyup="searchEmployees()">

    </div>



    <!-- ADD EMPLOYEE -->

    <div class="form-box">

        <h3>
            Add Employee Exit Record
        </h3>


        <div class="form-grid">


            <input
                type="text"
                id="name"
                placeholder="Employee Name">


            <input
                type="email"
                id="email"
                placeholder="Email">


            <input
                type="text"
                id="department"
                placeholder="Department">


            <input
                type="date"
                id="exitDate">


            <input
                type="text"
                id="reason"
                placeholder="Exit Reason">


        </div>


        <button
            class="add-btn"
            onclick="addEmployee()">

            Add Employee

        </button>


    </div>



    <!-- EMPLOYEE TABLE -->

    <div class="employee-box">

        <h3>
            Employee Exit Records
        </h3>


        <div class="table-container">


            <table>


                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Department</th>

                        <th>Exit Date</th>

                        <th>Reason</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="employeeTable">

                    <tr>

                        <td
                            colspan="7"
                            class="no-data">

                            Loading employee records...

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>

    </div>


</div>



<script>


/* EMPLOYEE ARRAY */

let employees = [];



/* LOGOUT */

function logout() {

    window.location.href =
        "login.html";

}



/* LOAD EMPLOYEES */

async function loadEmployees() {

    try {


        const response =
            await fetch("/employees");


        if (!response.ok) {

            throw new Error(
                "Failed to load employees"
            );

        }


        employees =
            await response.json();


        /* UPDATE EMPLOYEE COUNT */

        document.getElementById(
            "employeeCount"
        ).textContent =
            employees.length;


        displayEmployees(employees);


    }

    catch (error) {


        console.error(error);


        document.getElementById(
            "employeeTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="no-data">

                    Unable to load employee records

                </td>

            </tr>

        `;

    }

}



/* DISPLAY EMPLOYEES */

function displayEmployees(data) {


    const table =
        document.getElementById(
            "employeeTable"
        );


    table.innerHTML = "";


    if (data.length === 0) {


        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="no-data">

                    No employee records found

                </td>

            </tr>

        `;


        return;

    }



    data.forEach(employee => {


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${employee.id ?? ""}
            </td>

            <td>
                ${employee.name ?? ""}
            </td>

            <td>
                ${employee.email ?? ""}
            </td>

            <td>
                ${employee.department ?? ""}
            </td>

            <td>
                ${employee.exitDate ?? ""}
            </td>

            <td>
                ${employee.reason ?? ""}
            </td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editEmployee(${employee.id})">

                    Edit

                </button>

                <button
                    class="delete-btn"
                    onclick="deleteEmployee(${employee.id})">

                    Delete

                </button>

            </td>

        `;


        table.appendChild(row);

    });

}



/* ADD EMPLOYEE */

async function addEmployee() {


    const employee = {


        name:
            document.getElementById(
                "name"
            ).value.trim(),


        email:
            document.getElementById(
                "email"
            ).value.trim(),


        department:
            document.getElementById(
                "department"
            ).value.trim(),


        exitDate:
            document.getElementById(
                "exitDate"
            ).value,


        reason:
            document.getElementById(
                "reason"
            ).value.trim()

    };



    /* VALIDATION */

    if (

        !employee.name ||

        !employee.email ||

        !employee.department ||

        !employee.exitDate ||

        !employee.reason

    ) {


        alert(
            "Please fill all fields"
        );


        return;

    }



    try {


        const response =
            await fetch(
                "/employees",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            employee
                        )

                }
            );



        if (!response.ok) {

            throw new Error(
                "Failed to add employee"
            );

        }



        alert(
            "Employee added successfully!"
        );



        /* CLEAR FORM */

        document.getElementById(
            "name"
        ).value = "";


        document.getElementById(
            "email"
        ).value = "";


        document.getElementById(
            "department"
        ).value = "";


        document.getElementById(
            "exitDate"
        ).value = "";


        document.getElementById(
            "reason"
        ).value = "";



        /* RELOAD */

        loadEmployees();


    }

    catch (error) {


        console.error(error);


        alert(
            "Failed to add employee. Please check the server."
        );

    }

}



/* SEARCH */

function searchEmployees() {


    const searchText =

        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();



    const filteredEmployees =
        employees.filter(employee =>


            (employee.name || "")
                .toLowerCase()
                .includes(searchText)


            ||


            (employee.email || "")
                .toLowerCase()
                .includes(searchText)


            ||


            (employee.department || "")
                .toLowerCase()
                .includes(searchText)

        );



    displayEmployees(
        filteredEmployees
    );

}



/* EDIT EMPLOYEE */

async function editEmployee(id) {


    const employee =
        employees.find(
            emp => emp.id === id
        );


    if (!employee) {

        alert(
            "Employee not found"
        );

        return;

    }


    const name =
        prompt(
            "Enter Employee Name:",
            employee.name
        );


    if (name === null) {

        return;

    }


    const email =
        prompt(
            "Enter Email:",
            employee.email
        );


    if (email === null) {

        return;

    }


    const department =
        prompt(
            "Enter Department:",
            employee.department
        );


    if (department === null) {

        return;

    }


    const exitDate =
        prompt(
            "Enter Exit Date (YYYY-MM-DD):",
            employee.exitDate
        );


    if (exitDate === null) {

        return;

    }


    const reason =
        prompt(
            "Enter Exit Reason:",
            employee.reason
        );


    if (reason === null) {

        return;

    }


    const updatedEmployee = {

        name:
            name.trim(),

        email:
            email.trim(),

        department:
            department.trim(),

        exitDate:
            exitDate.trim(),

        reason:
            reason.trim()

    };


    try {


        const response =
            await fetch(
                "/employees/" + id,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            updatedEmployee
                        )

                }
            );


        if (!response.ok) {

            throw new Error(
                "Update failed"
            );

        }


        alert(
            "Employee updated successfully!"
        );


        loadEmployees();


    }

    catch (error) {


        console.error(error);


        alert(
            "Failed to update employee."
        );

    }

}



/* DELETE EMPLOYEE */

async function deleteEmployee(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this employee?"
        );


    if (!confirmDelete) {

        return;

    }



    try {


        const response =
            await fetch(
                "/employees/" + id,
                {

                    method: "DELETE"

                }
            );


        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }



        alert(
            "Employee deleted successfully!"
        );


        loadEmployees();


    }

    catch (error) {


        console.error(error);


        alert(
            "Failed to delete employee."
        );

    }

}



/* LOAD DATA WHEN PAGE OPENS */

loadEmployees();


</script>


</body>

</html>
